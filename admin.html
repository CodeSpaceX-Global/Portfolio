<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="admin">
  <h1>Admin panel</h1>

  <section id="login" class="panel">
    <h2 style="font-size:1.4rem">Login with GitHub</h2>
    <p class="muted">Enter your GitHub details. The token stays in this tab only and is cleared when you close it.</p>
    <form id="loginForm">
      <div class="row2">
        <label>GitHub username<input id="owner" required placeholder="yourusername"></label>
        <label>Repository name<input id="repo" required placeholder="yourusername.github.io"></label>
      </div>
      <label>Access token<input id="token" type="password" required placeholder="github_pat_..." autocomplete="off"></label>
      <p id="loginMsg" role="status"></p>
      <button class="btn primary" type="submit">Login</button>
    </form>
  </section>

  <section id="dash" hidden>
    <p><span id="who" class="muted"></span> <button id="logout" class="btn small">Logout</button></p>
    <div class="panel">
      <h2 id="formTitle" style="font-size:1.4rem;margin-bottom:1rem">Add product</h2>
      <form id="pform">
        <label>Title<input id="title" required></label>
        <label>Description<textarea id="desc" rows="3"></textarea></label>
        <div class="row2">
          <label>Category<input id="cat" placeholder="e.g. Websites" list="cats"></label>
          <label>Price<input id="price" placeholder="e.g. ₹499"></label>
        </div>
        <datalist id="cats"></datalist>
        <label>Product link (optional)<input id="link" type="url" placeholder="https://..."></label>
        <label>Image: upload<input id="file" type="file" accept="image/*"></label>
        <label>or image URL<input id="imgurl" placeholder="https://... or images/pic.jpg"></label>
        <img id="preview" alt="Preview">
        <p id="msg" role="status"></p>
        <div class="actions">
          <button class="btn primary" type="submit" id="saveBtn">Save product</button>
          <button class="btn" type="button" id="cancel" hidden>Cancel edit</button>
        </div>
      </form>
    </div>
    <div class="panel">
      <h2 style="font-size:1.4rem;margin-bottom:1rem">Your products</h2>
      <ul id="list" class="plist"></ul>
      <p class="notice" style="margin-top:1rem">After saving, GitHub Pages takes 1 to 2 minutes to show changes on the live site.</p>
    </div>
  </section>
</main>
<script src="admin.js"></script>
</body>
</html>
